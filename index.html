<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="https://pyscript.net/releases/2024.3.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2024.3.1/core.js"></script>

    <title>Non-Metal Elements Finder</title>

    <style>
        body {
            background: linear-gradient(135deg, #4e54c8, #8f94fb);
            min-height: 100vh;
            display: flex;
            align-items: center;
        }

        .card {
            border: none;
            border-radius: 20px;
        }

        .card-header {
            border-radius: 20px 20px 0 0 !important;
            background: linear-gradient(135deg, #3a3fbe, #6c63ff) !important;
        }

        #result {
            min-height: 120px;
            font-size: 1.05rem;
            background: #f8f9fa;
            border-left: 6px solid #6c63ff;
        }

        .footer-text {
            font-size: 0.9rem;
            color: #6c757d;
        }
    </style>
</head>

<body>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-7 col-md-9">
            <div class="card shadow-lg">
                <div class="card-header text-white text-center p-4">
                    <h2>
                        <i class="bi bi-flask-fill"></i>
                        Non-Metal Elements
                    </h2>
                    <p class="mb-0">
                        Periodic Table Information Finder
                    </p>
                </div>

                <div class="card-body p-4">
                    <div class="alert alert-info">
                        Enter the <b>symbol</b> of a non-metal element
                        (Example: H, O, Cl, Ne, C).
                    </div>

                    <form onsubmit="return false;">
                        <div class="mb-3">
                            <label for="element_name" class="form-label fw-bold">
                                Element Symbol
                            </label>
                            <input
                                type="text"
                                id="element_name"
                                class="form-control form-control-lg"
                                placeholder="Enter symbol here (e.g., O, Cl)">
                        </div>

                        <div class="d-grid">
                            <input
                                type="button"
                                py-click="element_checker"
                                value="Check Here"
                                class="btn btn-primary btn-lg" style="background-color: #6c63ff; border: none;">
                        </div>
                    </form>

                    <hr class="my-4">

                    <h5 class="text-primary mb-3" style="color: #4e54c8 !important;">
                        Result
                    </h5>

                    <div id="result" class="rounded p-3 shadow-sm d-flex align-items-center justify-content-center text-muted">
                        Enter a symbol above and click "Check Here".
                    </div>
                </div>

                <div class="card-footer bg-light text-center footer-text py-3">
                    <i class="bi bi-lightbulb-fill text-warning"></i>
                    Skills Test
                </div>
            </div>
        </div>
    </div>
</div>

<script type="py" src="main.py"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
